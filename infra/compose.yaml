name: payment-simulator

services:
  db:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: development
    init: true
    env_file:
      - ../apps/api/.env
    environment:
      NODE_ENV: development
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
      APP_INSTANCE_ID: ${APP_INSTANCE_ID:?Set APP_INSTANCE_ID in .env}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ../apps/api/src
          target: /workspace/apps/api/src
          initial_sync: true
          ignore: [generated/]
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../package-lock.json
        - action: rebuild
          path: ../apps/api/package.json
        - action: rebuild
          path: ../apps/web/package.json
        - action: rebuild
          path: ../apps/api/prisma
        - action: rebuild
          path: ../apps/api/prisma.config.ts
        - action: rebuild
          path: ../apps/api/tsconfig.json
        - action: rebuild
          path: ../apps/api/tsconfig.build.json
        - action: rebuild
          path: ../apps/api/nest-cli.json
        - action: rebuild
          path: ../apps/api/Dockerfile
        - action: rebuild
          path: ../.dockerignore

volumes:
  postgres-data:
